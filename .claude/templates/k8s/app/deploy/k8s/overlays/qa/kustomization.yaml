apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: __APP__-qa
resources: [../../base]
labels:
- pairs: {sdlc.io/env: qa}
configMapGenerator:
- name: app-config
  literals: [APP_ENV=qa]
secretGenerator:
- name: db-credentials
  envs: [secrets.env]          # gitignored; created by scripts/k8s/deploy.sh if missing
replicas:
- {name: api, count: 2}
patches:
- target: {kind: Ingress, name: web}
  patch: |-
    - {op: replace, path: /spec/rules/0/host, value: __APP__-qa.localhost}
# BEGIN images (managed by scripts/k8s/deploy.sh: digests only, never edit by hand)
images:
- {name: api, newName: localhost:5001/__APP__/api, newTag: not-deployed}
# END images
