# Base for one app. deployment_agent generates one <service>.yaml per stateless service from
# IMPLEMENTATION_GUIDELINES (api.yaml is the pattern); overlays set namespace, host, config and digests.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
- pairs: {app.kubernetes.io/part-of: __APP__}
resources:
- postgres.yaml
- api.yaml
- jobs.yaml
- ingress.yaml
configMapGenerator:
# db-roles.sh: Postgres runs it from /docker-entrypoint-initdb.d on an empty volume, the db-roles Job on
# every deploy. No hash suffix: editing the script must not restart Postgres (it only matters at initdb,
# and the Job mounts the current version each run).
- name: db-roles
  files: [db-roles.sh]
  options: {disableNameSuffixHash: true}
