# Pattern for a stateless HTTP service. The image name "api" is a placeholder the overlay rewrites to
# localhost:5001/__APP__/api@sha256:<digest> (scripts/k8s/deploy.sh pins digests, never tags).
# Images must declare a NUMERIC user (USER 65532:65532): runAsNonRoot cannot be verified for a name.
apiVersion: apps/v1
kind: Deployment
metadata: {name: api}
spec:
  replicas: 1
  revisionHistoryLimit: 3        # rollback is by digest (deploy.sh --rollback); old ReplicaSets are clutter
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: api
        image: api
        args: [serve]
        ports: [{containerPort: 8080}]
        envFrom: [{configMapRef: {name: app-config}}]
        env:
        - {name: DB_USER, valueFrom: {secretKeyRef: {name: db-credentials, key: DB_USER}}}
        - {name: DB_PASSWORD, valueFrom: {secretKeyRef: {name: db-credentials, key: DB_PASSWORD}}}
        - {name: DATABASE_URL, value: "postgres://$(DB_USER):$(DB_PASSWORD)@postgres:5432/app?sslmode=disable"}
        readinessProbe: {httpGet: {path: /readyz, port: 8080}, periodSeconds: 5}
        livenessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 10}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata: {name: api}
spec:
  selector: {app: api}
  ports: [{port: 8080}]
