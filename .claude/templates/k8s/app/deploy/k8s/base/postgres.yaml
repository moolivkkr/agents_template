# One Postgres per namespace (dev and qa never share data). Credentials come from the overlay's
# secretGenerator (secrets.env, gitignored, created by scripts/k8s/deploy.sh on first deploy).
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres}
spec:
  serviceName: postgres
  replicas: 1
  revisionHistoryLimit: 3
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
      - name: postgres
        image: postgres:17-alpine
        ports: [{containerPort: 5432}]
        env:
        - {name: POSTGRES_DB, value: app}
        - {name: POSTGRES_USER, valueFrom: {secretKeyRef: {name: db-credentials, key: DB_USER}}}
        - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: db-credentials, key: DB_PASSWORD}}}
        - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
        readinessProbe:
          exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d app']}
          periodSeconds: 5
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {memory: 512Mi}
        volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
  - metadata: {name: data}
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: local-path
      resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: postgres}
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
