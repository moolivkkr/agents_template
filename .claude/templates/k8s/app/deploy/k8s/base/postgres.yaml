# One Postgres per namespace (dev and qa never share data). Credentials come from the overlay's
# secretGenerator db-credentials (secrets.env, gitignored, created by scripts/k8s/deploy.sh on first deploy):
# three user/password pairs, one per role (scripts/k8s/deploylib.py DB_ROLES):
#   DB_SUPERUSER_*  bootstrap superuser: used only by Postgres itself and by db-roles.sh
#   DB_MIGRATOR_*   owns the schema and every table, NOSUPERUSER BYPASSRLS: db-migrate, db-seed (every
#                   FORCE-RLS table also has its migrator-only policy, D-001, so the same migrations run on RDS)
#   DB_APP_*        the services and db-rls-check: NOSUPERUSER NOBYPASSRLS, owns nothing, so FORCE row-level
#                   security applies
# On an EMPTY data directory the entrypoint runs db-roles.sh (ConfigMap db-roles), which creates both roles
# with their passwords; on every deploy the db-roles Job runs the same script to converge an existing volume.
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres}
spec:
  serviceName: postgres
  replicas: 1
  revisionHistoryLimit: 3
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
      - name: postgres
        image: postgres:17-alpine
        ports: [{containerPort: 5432}]
        env:
        - {name: POSTGRES_DB, value: app}
        - {name: POSTGRES_USER, valueFrom: {secretKeyRef: {name: db-credentials, key: DB_SUPERUSER_USER}}}
        - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: db-credentials, key: DB_SUPERUSER_PASSWORD}}}
        - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
        # read by /docker-entrypoint-initdb.d/db-roles.sh on first start only
        - {name: DB_MIGRATOR_USER, valueFrom: {secretKeyRef: {name: db-credentials, key: DB_MIGRATOR_USER}}}
        - {name: DB_MIGRATOR_PASSWORD, valueFrom: {secretKeyRef: {name: db-credentials, key: DB_MIGRATOR_PASSWORD}}}
        - {name: DB_APP_USER, valueFrom: {secretKeyRef: {name: db-credentials, key: DB_APP_USER}}}
        - {name: DB_APP_PASSWORD, valueFrom: {secretKeyRef: {name: db-credentials, key: DB_APP_PASSWORD}}}
        readinessProbe:
          exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d app']}
          periodSeconds: 5
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {memory: 512Mi}
        volumeMounts:
        - {name: data, mountPath: /var/lib/postgresql/data}
        - {name: initdb, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
      - name: initdb
        configMap: {name: db-roles, defaultMode: 0555}   # executable: the entrypoint runs it rather than sourcing it
  volumeClaimTemplates:
  - metadata: {name: data}
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: local-path
      resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: postgres}
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
