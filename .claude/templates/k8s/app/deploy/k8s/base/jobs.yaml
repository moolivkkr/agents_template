# Suspended CronJobs used as digest-pinned Job TEMPLATES (Jobs are immutable, so re-applying a Job with
# a new image fails; `kubectl create job <name> --from=cronjob/db-migrate` always uses the current digest).
#   db-migrate  forward-only schema migrations — run by deploy.sh before the rollout
#   db-seed     static/reference data, idempotent — run by deploy.sh after migrate, and by seed.sh
# wait-for-db: a NEW pod's first connections are refused for a few seconds while k3s's network-policy
# controller programs its IP (measured: 3/3 refused at t+0, 3/3 ok at t+5s under the env-isolation
# policy). Job retries don't help (each retry is a new pod, new IP); waiting inside the pod does.
apiVersion: batch/v1
kind: CronJob
metadata: {name: db-migrate}
spec:
  suspend: true
  schedule: "0 0 1 1 *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600   # results live in agent_state/deploy/*/history.jsonl
      template:
        spec:
          restartPolicy: Never
          securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
          initContainers:
          - name: wait-for-db
            image: postgres:17-alpine
            command: [sh, -c, 'for i in $(seq 1 120); do pg_isready -h postgres -p 5432 -q && exit 0; sleep 1; done; echo "postgres unreachable after 120s" >&2; exit 1']
            securityContext: {runAsUser: 70, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          containers:
          - name: migrate
            image: api
            args: [migrate]
            env:
            - {name: DB_USER, valueFrom: {secretKeyRef: {name: db-credentials, key: DB_USER}}}
            - {name: DB_PASSWORD, valueFrom: {secretKeyRef: {name: db-credentials, key: DB_PASSWORD}}}
            - {name: DATABASE_URL, value: "postgres://$(DB_USER):$(DB_PASSWORD)@postgres:5432/app?sslmode=disable"}
            securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: db-seed}
spec:
  suspend: true
  schedule: "0 0 1 1 *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600   # results live in agent_state/deploy/*/history.jsonl
      template:
        spec:
          restartPolicy: Never
          securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
          initContainers:
          - name: wait-for-db
            image: postgres:17-alpine
            command: [sh, -c, 'for i in $(seq 1 120); do pg_isready -h postgres -p 5432 -q && exit 0; sleep 1; done; echo "postgres unreachable after 120s" >&2; exit 1']
            securityContext: {runAsUser: 70, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          containers:
          - name: seed
            image: api
            args: [seed]
            env:
            - {name: DB_USER, valueFrom: {secretKeyRef: {name: db-credentials, key: DB_USER}}}
