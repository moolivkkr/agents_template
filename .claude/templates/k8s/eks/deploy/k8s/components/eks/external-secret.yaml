# db-credentials from AWS Secrets Manager, with the SAME keys the lab's secretGenerator produces, so the
# base and deploylib.py db-access are unchanged. External Secrets Operator (installed once per cluster by
# scripts/k8s/eks-bootstrap.sh) reads with its controller's EKS Pod Identity role, which Terraform scopes
# to exactly this environment's three secrets (infra/terraform/modules/platform: eso_read). Sources:
#   DB_SUPERUSER_*  the RDS-managed master secret (manage_master_user_password; RDS rotates it, ESO
#                   refreshes; only the db-roles Job reads these keys)
#   DB_MIGRATOR_*   <app>/<env>/db-migrator   {"username", "password"}  (Terraform, write-only: never in state)
#   DB_APP_*        <app>/<env>/db-app        {"username", "password"}
# The secret ids come from eks.env through the overlay's replacements. No value is ever in git.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata: {name: aws-secrets-manager}
spec:
  provider:
    aws:
      service: SecretsManager
      region: placeholder-region
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: db-credentials}
spec:
  refreshInterval: 15m
  secretStoreRef: {name: aws-secrets-manager, kind: SecretStore}
  target: {name: db-credentials, creationPolicy: Owner, deletionPolicy: Retain}
  data:
  - {secretKey: DB_SUPERUSER_USER, remoteRef: {key: placeholder-master-secret, property: username}}
  - {secretKey: DB_SUPERUSER_PASSWORD, remoteRef: {key: placeholder-master-secret, property: password}}
  - {secretKey: DB_MIGRATOR_USER, remoteRef: {key: placeholder-migrator-secret, property: username}}
  - {secretKey: DB_MIGRATOR_PASSWORD, remoteRef: {key: placeholder-migrator-secret, property: password}}
  - {secretKey: DB_APP_USER, remoteRef: {key: placeholder-app-secret, property: username}}
  - {secretKey: DB_APP_PASSWORD, remoteRef: {key: placeholder-app-secret, property: password}}
