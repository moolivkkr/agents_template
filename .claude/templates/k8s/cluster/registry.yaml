# In-cluster image registry for the sdlc lab cluster (human bootstrap, admin kubeconfig).
# Pinned to the server node (bigger disk). Exposed as NodePort 30501 on EVERY node, so:
#   - each node's containerd pulls through its own node IP (registries.yaml mirror
#     "localhost:5001" -> http://<nodeIP>:30501), and
#   - each Mac pushes to localhost:5001 (Lima forwards the node's 30501 to 127.0.0.1:5001).
# Plain HTTP: this registry is reachable only on loopback and the private Thunderbolt link.
apiVersion: v1
kind: Namespace
metadata:
  name: sdlc-system
  labels: {sdlc.io/role: system}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: registry-data, namespace: sdlc-system}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: {requests: {storage: 40Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: registry, namespace: sdlc-system, labels: {app: registry}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: registry}}
  template:
    metadata: {labels: {app: registry}}
    spec:
      nodeSelector: {node-role.kubernetes.io/control-plane: "true"}
      containers:
      - name: registry
        image: registry:3
        env:
        - {name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true"}
        ports: [{containerPort: 5000}]
        readinessProbe: {httpGet: {path: /v2/, port: 5000}, periodSeconds: 5}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {memory: 512Mi}
        volumeMounts: [{name: data, mountPath: /var/lib/registry}]
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: registry-data}
---
apiVersion: v1
kind: Service
metadata: {name: registry, namespace: sdlc-system}
spec:
  type: NodePort
  selector: {app: registry}
  ports: [{port: 5000, targetPort: 5000, nodePort: 30501}]
